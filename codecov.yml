# The total is informational. New and changed lines in a pull request must be covered to at
# least 90 %, so the coverage does not erode one change at a time.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        target: 90%

comment:
  layout: "condensed_header, diff, flags, files"
  require_changes: true
