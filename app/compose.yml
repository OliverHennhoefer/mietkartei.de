# Runs the published image on a server, e.g. from a laptop over SSH:
#   docker --context <server> compose -f app/compose.yml up -d
# See "Self-hosting the app" in .github/DEPLOYMENT.md.

name: mietkartei

services:
  app:
    image: ghcr.io/oliverhennhoefer/mietkartei:${MIETKARTEI_TAG:-latest}
    restart: unless-stopped
    # Bound to localhost by default. Set MIETKARTEI_BIND to a private address such as the server's
    # Tailscale IP, or keep localhost and put an HTTPS reverse proxy in front with ORIGIN set.
    ports:
      - ${MIETKARTEI_BIND:-127.0.0.1}:3000:3000
    volumes:
      - data:/data
    # The app only writes to /data. Everything else is read-only, the process cannot gain
    # privileges or use any Linux capability, so a compromised app cannot alter the image.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  data:
    name: mietkartei-data
