version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    labels:
      - abhängigkeiten
      - wartung
    commit-message:
      prefix: wartung
  - package-ecosystem: pip
    directory: "/docs"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    labels:
      - abhängigkeiten
      - wartung
    commit-message:
      prefix: wartung
  - package-ecosystem: npm
    directory: "/app"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      app-dependencies:
        update-types: [minor, patch]
    labels:
      - abhängigkeiten
      - wartung
    commit-message:
      prefix: wartung
  - package-ecosystem: docker
    directory: "/app"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    labels:
      - abhängigkeiten
      - wartung
    commit-message:
      prefix: wartung
