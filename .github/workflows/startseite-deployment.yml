name: Startseiten-Deployment erfassen

"on":
  check_run:
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  erfassen:
    name: Cloudflare-Bereitstellung in GitHub erfassen
    if: >-
      github.repository == 'OliverHennhoefer/mietkartei.de' &&
      ((github.event_name == 'check_run' &&
        github.event.check_run.app.id == 85455 &&
        github.event.check_run.app.slug == 'cloudflare-workers-and-pages' &&
        github.event.check_run.name == 'Workers Builds: mietkartei-startseite') ||
       (github.event_name != 'check_run' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: read
      deployments: write
    concurrency:
      group: startseite-deployment-${{ github.event.check_run.head_sha || github.sha }}
      cancel-in-progress: false
    steps:
      - name: Abgeschlossenen Produktionsbuild übernehmen
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const checkName = 'Workers Builds: mietkartei-startseite';
            const environment = 'website-production';
            const isHomepageCheck = check =>
              check?.app?.id === 85455 &&
              check.app.slug === 'cloudflare-workers-and-pages' &&
              check.name === checkName;

            let check;
            if (context.eventName === 'check_run') {
              ({ data: check } = await github.rest.checks.get({
                ...context.repo,
                check_run_id: context.payload.check_run.id,
              }));
            } else {
              // Der Push-Pfad erfasst Builds auch bei unterdrückten check_run-Ereignissen.
              for (let attempt = 0; attempt < 30; attempt++) {
                const { data } = await github.rest.checks.listForRef({
                  ...context.repo,
                  ref: context.sha,
                  check_name: checkName,
                  app_id: 85455,
                  filter: 'latest',
                  per_page: 100,
                });
                check = data.check_runs.filter(isHomepageCheck)
                  .sort((a, b) => b.id - a.id)[0];
                if (check?.status === 'completed') break;
                if (attempt < 29) await new Promise(resolve => setTimeout(resolve, 10000));
              }
            }

            if (!isHomepageCheck(check) || check.status !== 'completed') {
              core.setFailed('Kein abgeschlossener Cloudflare-Startseitenbuild gefunden. Nach dessen Abschluss den Workflow erneut ausführen.');
              return;
            }

            const { data: suite } = await github.rest.checks.getSuite({
              ...context.repo,
              check_suite_id: check.check_suite.id,
            });
            if (suite.head_branch !== 'main' || suite.head_sha !== check.head_sha ||
                suite.app?.id !== 85455 || suite.app.slug !== 'cloudflare-workers-and-pages') {
              core.info('Kein Produktionsbuild aus main; es wird kein Deployment angelegt.');
              return;
            }

            const states = {
              success: 'success',
              failure: 'failure',
              cancelled: 'error',
              timed_out: 'error',
              action_required: 'error',
              stale: 'error',
            };
            const state = states[check.conclusion];
            if (!state) {
              core.info(`Build ohne Bereitstellungsergebnis: ${check.conclusion}; kein Deployment angelegt.`);
              return;
            }

            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              ...context.repo,
              sha: check.head_sha,
              environment,
              per_page: 100,
            });
            let deployment = deployments.find(item =>
              item.payload?.cloudflare_check_run_id === check.id);
            if (!deployment) {
              ({ data: deployment } = await github.rest.repos.createDeployment({
                ...context.repo,
                ref: check.head_sha,
                environment,
                auto_merge: false,
                required_contexts: [],
                production_environment: true,
                transient_environment: false,
                description: 'Startseite über Cloudflare Workers Builds',
                payload: { cloudflare_check_run_id: check.id },
              }));
            }
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: deployment.id,
              state,
              environment_url: 'https://mietkartei.de',
              log_url: check.details_url,
              description: `Cloudflare-Startseitenbuild: ${check.conclusion}`,
            });
            core.info(`Deployment ${deployment.id} für ${check.head_sha} als ${state} erfasst.`);
