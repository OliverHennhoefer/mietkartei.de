name: Websites

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_VERSION: "4.151.1"

concurrency:
  group: websites-${{ github.event_name == 'pull_request' && github.run_id || github.ref }}
  queue: max

jobs:
  check:
    name: Check websites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: websites-check-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    outputs:
      docs: ${{ steps.changes.outputs.docs }}
      homepage: ${{ steps.changes.outputs.homepage }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changed websites
        id: changes
        env:
          WEB_EVENT_NAME: ${{ github.event_name }}
          WEB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          documentation = homepage = True
          base = os.environ['WEB_BASE_SHA']
          if os.environ['WEB_EVENT_NAME'] != 'workflow_dispatch' and base and set(base) != {'0'}:
              subprocess.run(['git', 'diff', '--check', base, 'HEAD'], check=True)
              paths = subprocess.check_output([
                  'git', 'diff', '--name-only', '--no-renames', '-z', base, 'HEAD',
              ]).decode().split('\0')
              shared = any(
                  path.startswith('assets/brand/') or path == '.github/workflows/websites.yml'
                  for path in paths
              )
              documentation = shared or any(
                  path.startswith('docs/') or path in {
                      'scripts/prepare_docs_assets.py', 'zensical.toml',
                  }
                  for path in paths
              )
              homepage = shared or any(
                  path.startswith('website/') or path in {
                      'scripts/build_homepage.py', 'scripts/build_guides.py',
                  }
                  for path in paths
              )

          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'docs={str(documentation).lower()}\n')
              output.write(f'homepage={str(homepage).lower()}\n')
          print(f'Build docs: {documentation}; build homepage: {homepage}')
          PY

      - name: Set up Python
        if: steps.changes.outputs.docs == 'true' || steps.changes.outputs.homepage == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build homepage
        if: steps.changes.outputs.homepage == 'true'
        run: python scripts/build_homepage.py

      - name: Install Zensical
        if: steps.changes.outputs.docs == 'true'
        run: python -m pip install --disable-pip-version-check --require-hashes -r docs/requirements.txt

      - name: Build docs and check internal links
        if: steps.changes.outputs.docs == 'true'
        run: |
          python scripts/prepare_docs_assets.py
          zensical build --clean --strict

      - name: Upload homepage for deployment
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.changes.outputs.homepage == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homepage
          path: dist/homepage
          if-no-files-found: error
          retention-days: 7

      - name: Upload docs for deployment
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.changes.outputs.docs == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs
          path: site
          if-no-files-found: error
          retention-days: 7

  deploy_homepage:
    name: Deploy homepage
    if: github.repository == 'OliverHennhoefer/mietkartei.de' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.check.outputs.homepage == 'true'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://mietkartei.de
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download checked homepage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: homepage
          path: dist/homepage

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy --config website/wrangler.toml

  deploy_docs:
    name: Deploy docs
    if: github.repository == 'OliverHennhoefer/mietkartei.de' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.check.outputs.docs == 'true'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://docs.mietkartei.de
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download checked docs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs
          path: site

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy --config docs/wrangler.toml
