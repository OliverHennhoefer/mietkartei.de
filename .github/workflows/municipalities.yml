name: Update Gemeinde data

# Rebuilds the Gemeinde table of the "Lage" tab (app/src/lib/server/municipalities-data.ts) from
# the newest Gemeindeverzeichnis, Zensus 2022 rents and Grundsteuer Hebesätze of Destatis, and
# opens a pull request when it changed. A pull request opened with the workflow token starts no
# workflows, so the checks are started by hand (workflow_dispatch) on its branch.

"on":
  schedule:
    - cron: "17 4 3 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: municipalities

jobs:
  update:
    name: Update Gemeinde data
    if: github.repository == 'OliverHennhoefer/mietkartei.de'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      BRANCH: data/municipalities
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install openpyxl
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r app/scripts/requirements-municipalities.txt

      - name: Build the table
        working-directory: app
        run: python -I scripts/municipalities.py

      - name: Open a pull request when the table changed
        run: |
          if git diff --quiet -- app/src/lib/server/municipalities-data.ts; then
            echo "The Gemeinde table is up to date."
            exit 0
          fi
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[]')" ]; then
            echo "A pull request for $BRANCH is already open; close it to get a fresh one."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit -m "Update the Gemeinde table from Destatis" -- app/src/lib/server/municipalities-data.ts
          git push --force origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Update the Gemeinde table from Destatis" \
            --body "Rebuilt by the workflow \"Update Gemeinde data\" with \`app/scripts/municipalities.py\` from the newest Gemeindeverzeichnis, Zensus 2022 rents and Grundsteuer Hebesätze. Check the year in the Grundsteuer section of the \"Lage\" tab and the unit tests before merging."
          gh workflow run app.yml --ref "$BRANCH"
          gh workflow run websites.yml --ref "$BRANCH"
