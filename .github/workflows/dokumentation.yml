name: Dokumentation

"on":
  push:
    branches:
      - main
    paths:
      - docs/**
      - zensical.toml
      - .github/workflows/dokumentation.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dokumentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pruefen:
    name: Dokumentation prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      veroeffentlichen: ${{ steps.aenderungen.outputs.veroeffentlichen }}
    steps:
      - name: Repository herunterladen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Änderungen und Dokumentationskonfiguration prüfen
        id: aenderungen
        env:
          DOCS_EVENT_NAME: ${{ github.event_name }}
          DOCS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DOCS_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          relevant = True
          if os.environ['DOCS_EVENT_NAME'] == 'pull_request':
              base = os.environ['DOCS_BASE_SHA']
              subprocess.run(['git', 'diff', '--check', base, 'HEAD'], check=True)
              paths = subprocess.check_output([
                  'git', 'diff', '--name-only', '--no-renames', '-z', base, 'HEAD',
              ]).decode().split('\0')
              relevant = any(
                  path.startswith('docs/') or path in {
                      'zensical.toml', '.github/workflows/dokumentation.yml',
                  }
                  for path in paths
              )

          configured = Path('zensical.toml').is_file()
          if relevant and not configured and any(Path('docs').rglob('*.md')):
              raise SystemExit('Dokumentationsseiten vorhanden, aber zensical.toml fehlt.')

          build = relevant and configured
          deploy = (build and os.environ['DOCS_EVENT_NAME'] != 'pull_request'
                    and os.environ['DOCS_REF'] == 'refs/heads/main')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'bauen={str(build).lower()}\n')
              output.write(f'veroeffentlichen={str(deploy).lower()}\n')

          if not configured:
              print('Die Dokumentationsseite ist in diesem Zweig noch nicht eingerichtet.')
          elif not relevant:
              print('Keine Änderungen an der Dokumentationsseite; Build entfällt.')
          PY

      - name: Python einrichten
        if: steps.aenderungen.outputs.bauen == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Zensical installieren
        if: steps.aenderungen.outputs.bauen == 'true'
        run: python -m pip install --disable-pip-version-check -r docs/requirements.txt

      - name: Dokumentation einschließlich interner Verweise prüfen
        if: steps.aenderungen.outputs.bauen == 'true'
        run: zensical build --clean --strict

      - name: Ausgabe für GitHub Pages bereitstellen
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.aenderungen.outputs.veroeffentlichen == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  veroeffentlichen:
    name: Auf GitHub Pages veröffentlichen
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.pruefen.outputs.veroeffentlichen == 'true'
    needs: pruefen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.bereitstellung.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Dokumentation veröffentlichen
        id: bereitstellung
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
