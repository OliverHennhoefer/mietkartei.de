name: App

"on":
  push:
    branches: [main]
    paths:
      - app/**
      - assets/brand/**
      - .dockerignore
      - .github/workflows/app.yml
  pull_request:
    paths:
      - app/**
      - assets/brand/**
      - .dockerignore
      - .github/workflows/app.yml
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: app

env:
  NODE_VERSION: "26"

jobs:
  check:
    name: Lint, type check and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Production dependencies fail on any advisory, the dev tooling only on high and critical
      # ones: a moderate advisory in a build tool rarely reaches the deployed app.
      - name: Audit dependencies
        run: |
          npm audit --omit=dev
          npm audit --audit-level=high

      - name: Verify package signatures
        run: npm audit signatures

      # The /api/e2e routes seed data without signing in; only the test servers may enable them.
      - name: Check that the test routes stay off in production
        run: |
          if grep -n '"E2E"' wrangler.jsonc; then
            echo "::error::wrangler.jsonc sets E2E, which opens the test routes on app.mietkartei.de."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Check that migrations match the schema
        run: |
          npx drizzle-kit generate --name schema-check
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "::error::src/lib/server/db/schema.ts changed without a migration. Run 'npm run db:generate' and commit the result."
            git status --porcelain -- drizzle
            exit 1
          fi

      - name: Unit tests
        run: npm run test:unit -- --run

  e2e:
    name: End-to-end tests (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [node, cloudflare]
    env:
      DEPLOY_TARGET: ${{ matrix.target }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.target }}
          path: app/test-results
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -f app/Dockerfile -t mietkartei:ci .

      - name: Start container and check health
        run: |
          docker run -d --name mietkartei -p 3000:3000 mietkartei:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health; then
              echo
              curl -fsS -o /dev/null http://localhost:3000/objekte
              exit 0
            fi
            sleep 1
          done
          docker logs mietkartei
          exit 1

  deploy:
    name: Deploy app
    needs: [check, e2e]
    if: github.repository == 'OliverHennhoefer/mietkartei.de' && github.event_name != 'pull_request' && github.event_name != 'release' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deployments on main run one after another and never cancel each other.
    concurrency:
      group: app-deploy
      cancel-in-progress: false
    environment:
      name: production
      url: https://app.mietkartei.de
    # The Cloudflare token can take over the production app and its database, so only the two
    # wrangler steps see it; the install and the build run third-party code.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the hosted database is configured
        run: |
          if grep -q '"database_id": "00000000-0000-0000-0000-000000000000"' wrangler.jsonc; then
            echo "::error::Enter the D1 database ID in app/wrangler.jsonc, see .github/DEPLOYMENT.md."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:cloudflare

      # Migrations only add to the schema, so the running version keeps working until the deploy.
      - name: Apply database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

  publish:
    name: Publish image
    needs: [check, e2e, docker]
    if: github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: .
    env:
      IMAGE: ghcr.io/oliverhennhoefer/mietkartei
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # main publishes latest; a release v1.2.3 publishes 1.2.3 and 1.2 so self-hosters can pin.
      - name: Build image
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          tags=(-t "$IMAGE:sha-${GITHUB_SHA::7}")
          if [ "$EVENT_NAME" = release ]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release tag $GITHUB_REF_NAME is not of the form v1.2.3."
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
            tags+=(-t "$IMAGE:$version" -t "$IMAGE:${version%.*}")
          else
            tags+=(-t "$IMAGE:latest")
          fi
          docker build -f app/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            "${tags[@]}" .

      - name: Push to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push --all-tags "$IMAGE"
          docker logout ghcr.io
