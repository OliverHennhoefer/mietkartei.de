name: App

"on":
  push:
    branches: [main]
    paths:
      - app/**
      - assets/brand/**
      - .dockerignore
      - .github/workflows/app.yml
  pull_request:
    paths:
      - app/**
      - assets/brand/**
      - .dockerignore
      - .github/workflows/app.yml
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: app

env:
  NODE_VERSION: "26"

jobs:
  check:
    name: Lint, type check and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Check that migrations match the schema
        run: |
          npx drizzle-kit generate --name schema-check
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "::error::src/lib/server/db/schema.ts changed without a migration. Run 'npm run db:generate' and commit the result."
            git status --porcelain -- drizzle
            exit 1
          fi

      - name: Unit tests
        run: npm run test:unit -- --run

  e2e:
    name: End-to-end tests (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [node, cloudflare]
    env:
      DEPLOY_TARGET: ${{ matrix.target }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.target }}
          path: app/test-results
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -f app/Dockerfile -t mietkartei:ci .

      - name: Start container and check health
        run: |
          docker run -d --name mietkartei -p 3000:3000 mietkartei:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health; then
              echo
              curl -fsS -o /dev/null http://localhost:3000/objekte
              exit 0
            fi
            sleep 1
          done
          docker logs mietkartei
          exit 1

      # Self-hosters update by starting a new image on their existing volume, so a migration
      # must not break a database created by the previously published image.
      - name: Upgrade a database from the published image
        run: |
          wait_healthy() {
            for attempt in $(seq 1 30); do
              curl -fsS -o /dev/null "http://localhost:$1/health" && return 0
              sleep 1
            done
            docker logs "$2"
            return 1
          }
          docker volume create upgrade-data
          docker run -d --name previous -p 3001:3000 -v upgrade-data:/data \
            ghcr.io/oliverhennhoefer/mietkartei:latest
          wait_healthy 3001 previous
          curl -fsS -o /dev/null -H "Origin: http://localhost:3001" \
            --data-urlencode "name=Upgrade-Testobjekt" --data-urlencode "street=Teststraße 1" \
            --data-urlencode "postalCode=12345" --data-urlencode "city=Teststadt" \
            "http://localhost:3001/objekte?/create"
          docker stop previous
          docker run -d --name current -p 3002:3000 -v upgrade-data:/data mietkartei:ci
          wait_healthy 3002 current
          if ! curl -fsS http://localhost:3002/objekte | grep -q "Upgrade-Testobjekt"; then
            echo "::error::A property created with the published image is missing after the upgrade."
            docker logs current
            exit 1
          fi

  publish:
    name: Publish image
    needs: [check, e2e, docker]
    if: github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: .
    env:
      IMAGE: ghcr.io/oliverhennhoefer/mietkartei
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # main publishes latest; a release v1.2.3 publishes 1.2.3 and 1.2 so self-hosters can pin.
      - name: Build image
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          tags=(-t "$IMAGE:sha-${GITHUB_SHA::7}")
          if [ "$EVENT_NAME" = release ]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release tag $GITHUB_REF_NAME is not of the form v1.2.3."
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
            tags+=(-t "$IMAGE:$version" -t "$IMAGE:${version%.*}")
          else
            tags+=(-t "$IMAGE:latest")
          fi
          docker build -f app/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            "${tags[@]}" .

      - name: Push to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push --all-tags "$IMAGE"
          docker logout ghcr.io
