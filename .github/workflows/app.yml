name: App

"on":
  push:
    branches: [main]
    paths:
      - app/**
      - assets/brand/**
      - .dockerignore
      - .github/workflows/app.yml
  pull_request:
    paths:
      - app/**
      - assets/brand/**
      - .dockerignore
      - .github/workflows/app.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: app

env:
  NODE_VERSION: "24"

jobs:
  check:
    name: Lint, type check and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Check that migrations match the schema
        run: |
          npx drizzle-kit generate --name schema-check
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "::error::src/lib/server/db/schema.ts changed without a migration. Run 'npm run db:generate' and commit the result."
            git status --porcelain -- drizzle
            exit 1
          fi

      - name: Unit tests
        run: npm run test:unit -- --run

  e2e:
    name: End-to-end tests (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [node, cloudflare]
    env:
      DEPLOY_TARGET: ${{ matrix.target }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.target }}
          path: app/test-results
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -f app/Dockerfile -t mietkartei:ci .

      - name: Start container and check health
        run: |
          docker run -d --name mietkartei -p 3000:3000 mietkartei:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health; then
              echo
              curl -fsS -o /dev/null http://localhost:3000/objekte
              exit 0
            fi
            sleep 1
          done
          docker logs mietkartei
          exit 1

  publish:
    name: Publish image
    needs: [check, e2e, docker]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: .
    env:
      IMAGE: ghcr.io/oliverhennhoefer/mietkartei
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: |
          docker build -f app/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$IMAGE:latest" -t "$IMAGE:sha-${GITHUB_SHA::7}" .

      - name: Push to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push --all-tags "$IMAGE"
          docker logout ghcr.io
