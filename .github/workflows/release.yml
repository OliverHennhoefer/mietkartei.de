name: Release

# A published release gets the source archive, its checksum and a signed build provenance that ties
# the archive to this repository, the tag and this workflow. Self-hosters can check a download with
# `sha256sum -c SHA256SUMS` and `gh attestation verify <archive> --owner OliverHennhoefer`. The
# Docker image is attested in app.yml when it is pushed. Started by hand on a release tag ("Use
# workflow from" the tag), it attaches the files to that release again, e.g. after a failed run.
# The run must start from the tag itself, since the provenance names the ref and commit it ran on.
"on":
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    name: Source archive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      attestations: write
      contents: write
      id-token: write
    if: github.ref_type == 'tag'
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build archive and checksum
        id: archive
        run: |
          name="mietkartei-${TAG#v}"
          git archive --format=tar.gz --prefix="$name/" -o "$name.tar.gz" HEAD
          sha256sum "$name.tar.gz" > SHA256SUMS
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.archive.outputs.name }}.tar.gz

      # The signed bundle on the release lets the archive be checked offline. It holds an in-toto
      # statement with SLSA provenance, and the .intoto.jsonl name gives the OpenSSF Scorecard's
      # Signed-Releases check its full score (a .sigstore.json name only counts as a signature).
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ steps.archive.outputs.name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "$NAME.intoto.jsonl"
          gh release upload "$TAG" "$NAME.tar.gz" "$NAME.intoto.jsonl" SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
