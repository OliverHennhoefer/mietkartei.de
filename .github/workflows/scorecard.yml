name: Scorecard

"on":
  push:
    branches:
      - main
  schedule:
    - cron: "17 5 * * 1"
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: OpenSSF Scorecard
    # Copies of the repository, such as those of the Deploy to Cloudflare button, run none of this.
    if: github.repository == 'OliverHennhoefer/mietkartei.de'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # v2.6.0 names a container image whose amd64 manifest is missing on ghcr.io, so the runner
      # cannot pull it; v2.5.0 until a later release fixes that.
      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
